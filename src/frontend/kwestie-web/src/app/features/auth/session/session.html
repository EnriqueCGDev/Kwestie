<main class="auth-page">
  <section class="auth-card" aria-labelledby="session-title">
    <div class="auth-brand"><span class="auth-mark" aria-hidden="true">K</span><span>Kwestie</span></div>
    <div class="auth-heading">
      <p class="auth-eyebrow">TU SESIÓN</p>
      <h1 id="session-title">Sesión iniciada</h1>
      <p>Ya puedes acceder a Kwestie. Las funciones del espacio de trabajo llegarán más adelante.</p>
    </div>

    @if (errorMessage(); as message) {
      <div class="auth-notice auth-notice--error" role="alert">{{ message }}</div>
    }

    <button class="auth-submit" type="button" [disabled]="pending()" (click)="logout()">
      {{ pending() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
    </button>
  </section>
</main>
